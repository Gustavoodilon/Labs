[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdi-lab"
version = "0.2.0"
description = "Projeto-base dos laboratorios M1"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless==5.0.0.93"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
